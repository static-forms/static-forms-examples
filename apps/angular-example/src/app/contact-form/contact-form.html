@if (status() === 'success') {
  <div class="success-message">
    <svg class="success-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
      <polyline points="22 4 12 14.01 9 11.01" />
    </svg>
    <h2>Message Sent!</h2>
    <p>Thank you for reaching out. We'll get back to you soon.</p>
    <button type="button" class="reset-button" (click)="status.set('idle')">Send another message</button>
  </div>
} @else {
  <form class="form" (submit)="handleSubmit($event)">
    <div class="field">
      <label for="name" class="label">Name</label>
      <input type="text" id="name" name="name" class="input" placeholder="Your name" required
        [disabled]="status() === 'loading'" />
    </div>

    <div class="field">
      <label for="email" class="label">Email</label>
      <input type="email" id="email" name="email" class="input" placeholder="your@email.com" required
        [disabled]="status() === 'loading'" />
    </div>

    <div class="field">
      <label for="message" class="label">Message</label>
      <textarea id="message" name="message" class="textarea" placeholder="Your message..." rows="5" required
        [disabled]="status() === 'loading'"></textarea>
    </div>

    @if (status() === 'error') {
      <div class="error-message">{{ errorMessage() }}</div>
    }

    <button type="submit" class="submit-button" [disabled]="status() === 'loading'">
      @if (status() === 'loading') {
        <span class="spinner"></span>
        Sending...
      } @else {
        Send Message
      }
    </button>
  </form>
}
